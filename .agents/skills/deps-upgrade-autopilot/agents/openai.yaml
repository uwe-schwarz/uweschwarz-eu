interface:
  display_name: "Dependency Upgrade Autopilot"
  short_description: "Inventory dependencies; validate and publish changed runs"
  default_prompt: "Use $deps-upgrade-autopilot in this repository's saved cloud environment. Preserve Bun, release gates, compatibility holds, and complete dependency/toolchain inventory. If inventory and any required manifest/lockfile normalization establish a true no-op, send the single Healthchecks success signal and return before baseline checks, screenshots, deployment-provider authentication, or production checks. For changed runs, retain all quality gates and seven before/after screenshot targets; commit and push origin/main, then verify the exact production deployment and read-only smoke checks. Stay silent on routine outcomes."
